[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seodealgam-cardinality"
version = "0.1.0"
description = "把输入按语义边界切成独立单元，逐单元核对指标标签的基数爆炸相关的特征并标出命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "seodealgam" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://seodealgam.github.io"
Repository = "https://github.com/seodealgam/cardinality"
Issues = "https://github.com/seodealgam/cardinality/issues"

[project.scripts]
cardinality = "cardinality:main"

[tool.setuptools]
py-modules = ["cardinality"]
